name: Verify build

on:
  pull_request:
  push:
    branches: [master]

jobs:
  # The archived web app (archive/web-app) still builds, so it can be brought back.
  nextjs-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archive/web-app
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: archive/web-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build and typecheck
        run: npm run build

  extension-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the manifest and scripts
        run: node .github/scripts/check-extension.mjs
