name: Verify build

on:
  pull_request:
  push:
    branches: [master]

jobs:
  nextjs-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and typecheck
        run: npm run build
