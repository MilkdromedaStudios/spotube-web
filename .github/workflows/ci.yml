name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Static build (what Cloudflare Pages deploys)
        run: npm run build
      - name: Bundle the Pages Function
        run: npx wrangler pages functions build --outdir "$RUNNER_TEMP/functions"
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests on the local Pages runtime (desktop + mobile)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
